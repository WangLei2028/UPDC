[updc]
schema_version = 1

[instrument]
adapter = "fits"

[input]
input_dir = "./normalized_exposures"
input_glob = "*.fits"
pairing = "sorted"
wcs_mode = "fits"
weight_mode = "rnoise-sky"
bad_dq_mask = 0
poisson_pedestal_sigma = 0.0

[psf]
psf_dir = "./psfs"
psf_glob = "*.fits"
psf_orientation = "as-is"
psf_frame = "detector"
psf_oversample = 2
psf_crop_size = 0

[solver]
iterations = 19
upsample = 2
save_every = 0

[performance]
workers = 1
fft_workers = 2
exposure_workers = 2
preprocess_workers = 4
fft_plan = "measure"
fft_autotune = true
retune_fft = false

[cache]
enabled = true
reset = "none"
prune_after_days = 30

[output]
output_dir = "./updc_output"
keep_work = false

[build]
cc = "cc"
